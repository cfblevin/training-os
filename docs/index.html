<style>
/* Layout, density and controls. Colours and type live in themes.css. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 var(--font-ui);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent); color: var(--accent-ink); }

.app {
  display: flex; flex-direction: column;
  min-height: 100%; max-width: 620px; margin: 0 auto;
}

/* ---------------------------------------------------------------- app bar */
.appbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.appbar-row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.appbar h1 {
  margin: 0; font: var(--h1-font); letter-spacing: var(--h1-track);
  flex: 1; min-width: 0; text-transform: var(--h1-case);
}
.appbar-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.chip {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 999px;
  color: var(--muted); white-space: nowrap; background: var(--surface);
}
.chip-accent { color: var(--accent); border-color: var(--accent-line); }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.save-dot[data-state="saving"] { background: var(--warn); }
.save-dot[data-state="error"] { background: var(--danger); }
.save-dot[data-state="recovered"] { background: var(--accent); }

/* ---------------------------------------------------------------- screen */
.screen {
  flex: 1; padding: 14px 16px calc(96px + env(safe-area-inset-bottom));
  min-width: 0;
}
.section { margin: 0 0 22px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; margin: 0 0 8px;
}
.section-title {
  font: var(--label-font); letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hr { height: 1px; background: var(--line); margin: 14px 0; border: 0; }

/* ---------------------------------------------------------------- cards */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px;
  box-shadow: var(--card-shadow);
}
.card-lead { border-color: var(--line-strong); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card-title { font: var(--card-title-font); margin: 0; letter-spacing: var(--card-title-track); }
.card-kicker {
  font: var(--label-font); letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 6px;
}
.why { color: var(--muted); font-size: 13.5px; margin: 10px 0 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface-alt);
  font-weight: 600; font-size: 15px; width: 100%;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-quiet { background: none; border-color: var(--line); color: var(--muted); font-weight: 500; }
.btn-danger { color: var(--danger); border-color: var(--danger-line); }
.btn-sm { min-height: 44px; font-size: 13px; padding: 0 14px; width: auto; }
.btn:disabled { opacity: .45; }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1 1 0; min-width: 0; }

.badge {
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; color: var(--accent);
  border: 1px solid var(--accent-line); white-space: nowrap; flex: none;
}
.badge-quiet { color: var(--muted); border-color: var(--line-strong); }
.badge-good { color: var(--good); border-color: var(--good-line); }

/* ---------------------------------------------------------------- carousel */
.carousel {
  display: flex; gap: 0; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  scroll-padding-left: 16px;
  /* Full-bleed without relying on the parent's resolved width. */
  margin: 0 -16px; width: calc(100% + 32px); max-width: calc(100% + 32px);
  padding: 2px 0 8px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.carousel::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto; width: 92px; scroll-snap-align: start;
  padding: 10px 10px 12px; text-align: left;
  border-right: 1px solid var(--line-strong);
  background: none; min-height: 104px;
  display: flex; flex-direction: column; gap: 4px;
}
.day:first-child { padding-left: 16px; width: 108px; }
.day:last-child { border-right: 0; padding-right: 16px; width: 108px; }
.day-dow { font: var(--label-font); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.day-num { font-family: var(--font-num); font-size: 21px; line-height: 1; font-weight: 600; }
.day-title { font-size: 11.5px; line-height: 1.25; color: var(--muted); }
.day-rest .day-title { color: var(--faint); }
.day[aria-current="date"] { background: var(--surface); }
.day[aria-current="date"] .day-num { color: var(--accent); }
.day[aria-current="date"] .day-dow { color: var(--accent); }
.day-mark { font-size: 10px; color: var(--good); letter-spacing: .1em; }
.day-dots { display: flex; gap: 3px; margin-top: auto; }
.day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line-strong); }
.day-dot-p { background: var(--accent); }

/* ---------------------------------------------------------------- list rows */
.list { border-top: 1px solid var(--line); }
.list-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 12px 2px; min-height: 52px; text-align: left;
  border-bottom: 1px solid var(--line); min-width: 0;
}
.list-row-main { flex: 1; min-width: 0; }
.list-name { font-size: 15px; font-weight: 500; }
.list-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.list-right { text-align: right; flex: none; color: var(--muted); font-size: 12.5px; }
.caret { color: var(--faint); flex: none; }

/* ---------------------------------------------------------------- workout */
.workout {
  position: fixed; inset: 0; z-index: 60; background: var(--bg);
  display: flex; flex-direction: column;
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .workout, .sheet { animation: none } }
.workout-bar {
  display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
  border-bottom: 1px solid var(--line-strong); background: var(--bg);
}
.workout-bar h2 { font: var(--card-title-font); margin: 0; flex: 1; min-width: 0; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; flex: none;
  display: grid; place-items: center; color: var(--muted); font-size: 19px;
}
.icon-btn:active { background: var(--surface-alt); }
.workout-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 10px 14px calc(120px + env(safe-area-inset-bottom));
}
.progressbar { height: 2px; background: var(--line); }
.progressbar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.ex {
  border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 8px; background: var(--surface); overflow: hidden;
}
.ex[data-open="true"] { border-color: var(--line-strong); background: var(--surface-open); }
/* Anchors are marked with a rule rather than a label: one less thing to read. */
.ex[data-anchor="true"] { border-left: 3px solid var(--accent-line); }
.ex[data-done="true"] .ex-name { color: var(--muted); }
.ex-head {
  display: flex; align-items: flex-start; gap: 8px; width: 100%;
  padding: 12px; text-align: left; min-width: 0;
}
.ex-head-main { flex: 1; min-width: 0; }
.ex-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ex-name { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
.ex-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; font-size: 12.5px; color: var(--muted); }
.ex-meta b { font-family: var(--font-num); font-weight: 600; color: var(--text); }
.ex-body { padding: 0 12px 12px; }
.ex-done-mark { color: var(--good); font-size: 15px; flex: none; }

.setrow {
  display: grid; grid-template-columns: 22px 1fr 1fr 46px;
  gap: 6px; align-items: center; padding: 5px 0;
  border-top: 1px solid var(--line);
}
.setrow-uni { grid-template-columns: 22px 1fr 1fr 1fr 46px; }
.set-i { font-family: var(--font-num); font-size: 12px; color: var(--faint); text-align: center; }
.field {
  min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); display: flex; flex-direction: column;
  align-items: center; justify-content: center; line-height: 1.05; padding: 2px;
  min-width: 0;
}
.field-val { font-family: var(--font-num); font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.field-unit { font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-top: 1px; }
.field-empty .field-val { color: var(--faint); font-weight: 500; }
.tick {
  min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  display: grid; place-items: center; font-size: 19px; color: var(--muted);
}
.setrow[data-done="true"] .tick { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.setrow[data-done="true"] .field { border-color: var(--line); }
.setrow[data-done="true"] .field-val { color: var(--muted); }

.bench {
  margin: 10px 0 0; padding: 8px 10px; border-left: 2px solid var(--accent-line);
  font-size: 12.5px; color: var(--muted); background: var(--surface-alt);
}
.bench-quiet { border-left-color: var(--line-strong); color: var(--faint); }
.suggest {
  margin: 10px 0 0; padding: 10px; border: 1px solid var(--accent-line);
  border-radius: var(--radius-sm); background: var(--surface-alt);
}
.suggest-text { font-size: 13.5px; }
.ex-links { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.link {
  font-size: 12.5px; color: var(--accent); text-decoration: none;
  min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px;
  border-radius: var(--radius-sm);
}
.link:active { background: var(--surface-alt); }
.next-cue {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
}

/* ---------------------------------------------------------------- timer pill */
.timer {
  position: fixed; z-index: 70; right: 14px;
  bottom: calc(74px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 999px;
  background: var(--pill-bg); border: 1px solid var(--line-strong);
  box-shadow: var(--pill-shadow); color: var(--text);
}
.timer[data-min="true"] { padding: 6px 10px; opacity: .92; }
.timer-time { font-family: var(--font-num); font-size: 15px; font-weight: 600; letter-spacing: .02em; }
.timer-label { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.timer-btn { color: var(--muted); font-size: 13px; padding: 0 2px; }
.timer[data-over="true"] .timer-time { color: var(--accent); }

/* ---------------------------------------------------------------- tab bar */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; background: var(--bar-bg); border-top: 1px solid var(--line-strong);
  padding-bottom: env(safe-area-inset-bottom);
  backdrop-filter: saturate(140%) blur(12px);
}
.tab {
  flex: 1 1 0; min-width: 0; padding: 9px 2px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--faint); font-size: 10.5px; letter-spacing: .02em;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }

/* ---------------------------------------------------------------- sheets */
.scrim {
  position: fixed; inset: 0; z-index: 80; background: var(--scrim);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto;
  background: var(--surface); border-top-left-radius: 16px; border-top-right-radius: 16px;
  border: 1px solid var(--line-strong); border-bottom: 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  animation: sheetup .2s ease-out;
}
@keyframes sheetup { from { transform: translateY(24px) } to { transform: none } }
.sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 6px auto 12px; }
.sheet h3 { margin: 0 0 4px; font: var(--card-title-font); }
.sheet-sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.menu { display: grid; }
.menu button {
  text-align: left; padding: 14px 4px; min-height: 50px;
  border-bottom: 1px solid var(--line); font-size: 15px;
}
.menu button:last-child { border-bottom: 0; }
.menu .danger { color: var(--danger); }
.menu-note { font-size: 12px; color: var(--faint); margin-top: 2px; }

.input, select.input, textarea.input {
  width: 100%; min-height: 46px; padding: 10px 12px;
  background: var(--surface-alt); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); color: var(--text);
}
textarea.input { min-height: 88px; resize: vertical; }
.field-label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }

.picker-value { text-align: center; padding: 6px 0 12px; }
.picker-num { font-family: var(--font-num); font-size: 42px; font-weight: 600; line-height: 1; }
.picker-unit { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .btn { flex: none; width: 56px; font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  min-height: 40px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface-alt);
  font-size: 14px; font-family: var(--font-num);
}
.chip-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip-word { font-family: var(--font-ui); font-size: 13px; }
.numpad { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.apply-remaining {
  display: flex; align-items: center; gap: 10px; margin: 14px 0 0;
  padding: 10px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--muted);
}
.apply-remaining input { width: 20px; height: 20px; accent-color: var(--accent); }

/* ---------------------------------------------------------------- disclosure */
.disc { border-bottom: 1px solid var(--line); }
.disc > summary {
  list-style: none; cursor: pointer; padding: 14px 2px; min-height: 50px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 15px; font-weight: 500;
}
.disc > summary::-webkit-details-marker { display: none; }
.disc > summary::after { content: '⌄'; color: var(--faint); font-size: 16px; }
.disc[open] > summary::after { content: '⌃'; }
.disc-body { padding: 0 2px 16px; }
.explainer { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* ---------------------------------------------------------------- charts */
.chart { width: 100%; height: 168px; display: block; }
.chart-axis { font-size: 9px; fill: var(--faint); font-family: var(--font-num); }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart-area { fill: var(--accent-wash); }
.chart-dot { fill: var(--accent); }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }

.ledger-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.ledger-name { width: 84px; flex: none; font-size: 12.5px; }
.ledger-bar { flex: 1; height: 8px; background: var(--line); border-radius: 2px; display: flex; min-width: 0; position: relative; overflow: hidden; }
.ledger-bar i { display: block; height: 100%; }
.ledger-planned { background: var(--accent); }
.ledger-added { background: var(--accent-soft); }
.ledger-indirect { background: var(--line-strong); }
.ledger-tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--text); opacity: .55; }
.ledger-count { width: 82px; flex: none; text-align: right; white-space: nowrap; font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.ledger-under { color: var(--warn); }
.swatch { display: inline-block; width: 14px; height: 8px; margin-right: 5px; border-radius: 2px; }
.swatch-indirect { background: var(--line-strong); }

.seg { display: flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { flex: 1 1 0; min-height: 40px; font-size: 13.5px; color: var(--muted); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--surface-alt); color: var(--text); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line-strong); }

.empty { padding: 26px 8px; text-align: center; color: var(--muted); font-size: 13.5px; }

.toast-root { position: fixed; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 90; display: grid; justify-items: center; gap: 6px; pointer-events: none; }
.toast {
  background: var(--toast-bg); color: var(--toast-ink); padding: 9px 14px;
  border-radius: 999px; font-size: 13px; max-width: 88vw;
  border: 1px solid var(--line-strong);
}

.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.photo-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); }

@media (max-width: 340px) {
  .screen { padding-left: 12px; padding-right: 12px; }
  .carousel { margin: 0 -12px; width: calc(100% + 24px); max-width: calc(100% + 24px); scroll-padding-left: 12px; }
  .day:first-child { padding-left: 12px; }
  .day:last-child { padding-right: 12px; }
  .day { width: 84px; }
  .setrow { grid-template-columns: 18px 1fr 1fr 42px; gap: 4px; }
  .setrow-uni { grid-template-columns: 18px 1fr 1fr 1fr 42px; }
  .field-val { font-size: 17px; }
  .ledger-name { width: 58px; font-size: 11.5px; }
  .ledger-count { width: 76px; font-size: 10.5px; }
}

/* Presentation only: colour, type and surface treatment.
   No theme changes layout, navigation, workflow or exercise logic. */

:root {
  --radius: 12px;
  --radius-sm: 9px;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}

/* ---------------------------------------------- 1. Analog Instrument Panel */
[data-theme="analog"] {
  --bg: #121315;
  --surface: #191b1d;
  --surface-alt: #1f2225;
  --surface-open: #1c1f22;
  --line: #26292d;
  --line-strong: #343a40;
  --text: #ecedee;
  --muted: #9aa0a6;
  --faint: #848a91;
  --accent: #5b8fb0;
  --accent-ink: #0f161b;
  --accent-line: #2f4d61;
  --accent-soft: #2f4d61;
  --accent-wash: rgba(91, 143, 176, .14);
  --good: #6fae72;
  --good-ink: #12180f;
  --good-line: #38583a;
  --warn: #d8a44f;
  --danger: #d97c6a;
  --danger-line: #6d3a32;
  --bar-bg: rgba(18, 19, 21, .88);
  --pill-bg: #1f2225;
  --pill-shadow: 0 6px 20px rgba(0, 0, 0, .45);
  --card-shadow: none;
  --scrim: rgba(0, 0, 0, .55);
  --toast-bg: #24282c;
  --toast-ink: #ecedee;
  --font-ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, system-ui, sans-serif;
  --h1-font: 600 26px/1.1 var(--font-ui);
  --h1-track: -.02em;
  --h1-case: none;
  --card-title-font: 600 17px/1.25 var(--font-ui);
  --card-title-track: -.01em;
  --label-font: 600 10.5px/1.2 var(--font-num);
  color-scheme: dark;
}

/* ---------------------------------------------- 2. Alpine Field Log */
[data-theme="alpine"] {
  --bg: #f3efe6;
  --surface: #fbf8f1;
  --surface-alt: #efeadd;
  --surface-open: #fdfbf6;
  --line: #ddd5c4;
  --line-strong: #c6bca6;
  --text: #22201b;
  --muted: #6d6555;
  --faint: #716855;
  --accent: #2f5d3f;
  --accent-ink: #f7f4ec;
  --accent-line: #a9bfae;
  --accent-soft: #9cb6a4;
  --accent-wash: rgba(47, 93, 63, .1);
  --good: #3f7a4c;
  --good-ink: #f7f4ec;
  --good-line: #a9bfae;
  --warn: #9a6b1f;
  --danger: #9c3b2c;
  --danger-line: #d3b1a9;
  --bar-bg: rgba(243, 239, 230, .92);
  --pill-bg: #fbf8f1;
  --pill-shadow: 0 4px 14px rgba(70, 60, 40, .18);
  --card-shadow: 0 1px 0 rgba(120, 108, 84, .12);
  --scrim: rgba(40, 34, 24, .34);
  --toast-bg: #2b2921;
  --toast-ink: #f6f2e8;
  --font-ui: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --h1-font: 600 25px/1.15 var(--font-ui);
  --h1-track: 0;
  --h1-case: none;
  --card-title-font: 600 17px/1.28 var(--font-ui);
  --card-title-track: 0;
  --label-font: 600 10.5px/1.2 var(--font-num);
  color-scheme: light;
}
[data-theme="alpine"] .card { border-radius: 6px; }
[data-theme="alpine"] .ex { border-radius: 6px; }
[data-theme="alpine"] .field, [data-theme="alpine"] .tick, [data-theme="alpine"] .btn { border-radius: 5px; }

/* ---------------------------------------------- 3. Midnight Ledger */
[data-theme="midnight"] {
  --bg: #0a0d13;
  --surface: #11151e;
  --surface-alt: #161c28;
  --surface-open: #131925;
  --line: #1d2531;
  --line-strong: #2a3444;
  --text: #e4eaf2;
  --muted: #8794a8;
  --faint: #788598;
  --accent: #66b6cc;
  --accent-ink: #08121a;
  --accent-line: #2f5a68;
  --accent-soft: #2f5a68;
  --accent-wash: rgba(102, 182, 204, .12);
  --good: #5eb39a;
  --good-ink: #07130f;
  --good-line: #2c5a4e;
  --warn: #cfa55e;
  --danger: #cf7b78;
  --danger-line: #5e3436;
  --bar-bg: rgba(10, 13, 19, .9);
  --pill-bg: #161c28;
  --pill-shadow: 0 6px 22px rgba(0, 0, 0, .6);
  --card-shadow: none;
  --scrim: rgba(3, 6, 10, .62);
  --toast-bg: #1b222e;
  --toast-ink: #e4eaf2;
  --font-ui: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --h1-font: 500 24px/1.12 var(--font-ui);
  --h1-track: .01em;
  --h1-case: none;
  --card-title-font: 500 16.5px/1.25 var(--font-ui);
  --card-title-track: .005em;
  --label-font: 500 10.5px/1.2 var(--font-num);
  color-scheme: dark;
}
[data-theme="midnight"] .card, [data-theme="midnight"] .ex { border-radius: 10px; }
[data-theme="midnight"] .appbar h1 { font-weight: 500; }

/* ---------------------------------------------- 4. Chalk & Iron */
[data-theme="chalk"] {
  --bg: #0c0c0d;
  --surface: #141416;
  --surface-alt: #1c1c1f;
  --surface-open: #171719;
  --line: #2f2f34;
  --line-strong: #4d4d55;
  --text: #f5f4f2;
  --muted: #a9a8a4;
  --faint: #858489;
  --accent: #d8412f;
  --accent-ink: #faf8f6;
  --accent-line: #7a2a20;
  --accent-soft: #7a2a20;
  --accent-wash: rgba(216, 65, 47, .14);
  /* No green anywhere: a completed set goes solid chalk. */
  --good: #e9e7e3;
  --good-ink: #0c0c0d;
  --good-line: #6a6970;
  --warn: #d8a44f;
  --danger: #ef7a66;
  --danger-line: #7a2a20;
  --bar-bg: rgba(12, 12, 13, .92);
  --pill-bg: #1c1c1f;
  --pill-shadow: 0 6px 20px rgba(0, 0, 0, .6);
  --card-shadow: none;
  --scrim: rgba(0, 0, 0, .7);
  --toast-bg: #1f1f23;
  --toast-ink: #f5f4f2;
  --font-ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, system-ui, sans-serif;
  --h1-font: 700 21px/1.1 var(--font-ui);
  --h1-track: .06em;
  --h1-case: uppercase;
  --card-title-font: 700 17px/1.2 var(--font-ui);
  --card-title-track: -.01em;
  --label-font: 700 10.5px/1.2 var(--font-num);
  color-scheme: dark;
}
/* Square corners and full-strength rules: the loudest, most legible of the four. */
[data-theme="chalk"] .card,
[data-theme="chalk"] .ex,
[data-theme="chalk"] .sheet { border-radius: 2px; }
[data-theme="chalk"] .field,
[data-theme="chalk"] .tick,
[data-theme="chalk"] .btn,
[data-theme="chalk"] .input,
[data-theme="chalk"] .seg { border-radius: 2px; }
[data-theme="chalk"] .badge { border-radius: 1px; letter-spacing: .09em; }
[data-theme="chalk"] .section-title { letter-spacing: .14em; }
[data-theme="chalk"] .day { border-right-color: var(--line-strong); }

</style>

function lineChart(points, pick, { label }) {

  const hi = min === max ? max + 5 : max + (max - min) * 0.15;
  const x = (i) => padL + (points.length === 1 ? (w - padL - padR) / 2 : (i * (w - padL - padR)) / (points.length - 1));
  const y = (v) => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo || 1));

  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(pick(p)).toFixed(1)}`).join(' ');
  const area = `${d} L${x(points.length - 1).toFixed(1)},${h - padB} L${x(0).toFixed(1)},${h - padB} Z`;
  const svgNS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(svgNS, 'svg');
  s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  s.setAttribute('class', 'chart');
  s.setAttribute('role', 'img');
  s.setAttribute('aria-label', `${label}: ${vals.join(', ')}`);
  const ticks = [hi, (hi + lo) / 2, lo];
  s.innerHTML = [
    ...ticks.map((t) => `<line class="chart-grid" x1="${padL}" x2="${w - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`),
    ...ticks.map((t) => `<text class="chart-axis" x="2" y="${(y(t) + 3).toFixed(1)}">${Math.round(t)}</text>`),
    points.length > 1 ? `<path class="chart-area" d="${area}"/>` : '',
    points.length > 1 ? `<path class="chart-line" d="${d}"/>` : '',
    ...points.map((p, i) => `<circle class="chart-dot" cx="${x(i).toFixed(1)}" cy="${y(pick(p)).toFixed(1)}" r="3"/>`),
    `<text class="chart-axis" x="${padL}" y="${h - 6}">${points[0].date.slice(5)}</text>`,
    points.length > 1 ? `<text class="chart-axis" x="${w - padR}" y="${h - 6}" text-anchor="end">${points[points.length - 1].date.slice(5)}</text>` : '',
  ].join('');
  return s;
}

function addPhoto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 720;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.72);
      set((s) => {
        s.photos = [...(s.photos || []), { id: `p_${Date.now()}`, date: dateKey(), dataUrl, note: '' }];
      });
      toast('Photo saved to this device');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
